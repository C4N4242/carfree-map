# 地域設定の例。regions/<地域id>.toml として保存し、--region <地域id> で指定する。

[region]
name = "地域の表示名"
timezone = "Asia/Tokyo"
bbox = [35.00, 135.00, 35.10, 135.15]   # 道路網・施設を取得する範囲 [南, 西, 北, 東]
hubs = ["〇〇駅", "△△バスターミナル"]     # 起点にする停留所名（GTFS の stop_name と完全一致）

# 徒歩の設定（省略時は以下の値）
[walk]
speed_m_per_min = 80.0   # 平坦な道での歩く速さ
weather_factor = 1.0     # 天候による係数（例: 雨や雪の日は 1 より小さくする）
max_grade = 0.3          # 標高誤差による極端な勾配を抑える上限
minutes = [5, 10, 15]    # 集計する徒歩時間 [分]

# GTFS（GTFS-JP を含む）フィード。複数書くと合算して計算する。
# url: zip を直接指す URL / page: zip へのリンクが載っている配布ページ（先頭のリンクを使う）
[[gtfs]]
id = "bus_a"
name = "A バス"
url = "https://example.com/gtfs/bus_a.zip"

[[gtfs]]
id = "bus_b"
name = "B バス"
page = "https://example.com/opendata/"
