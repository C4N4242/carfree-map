# 島根県松江市・出雲市

[region]
name = "島根県 松江市・出雲市"
timezone = "Asia/Tokyo"
# 松江市中心部〜出雲市中心部・出雲大社を含む範囲 [南, 西, 北, 東]
bbox = [35.33, 132.66, 35.50, 133.12]
# 1日の発車本数ランキング（2026-12-01）をもとに選定
hubs = ["松江駅", "県民会館前", "松江しんじ湖温泉駅", "ＪＲ出雲市駅"]

# 松江市交通局（市営バス）と一畑バスの共同フィード。agency_id で事業者を区別できる。
[[gtfs]]
id = "matsue_ichibata"
name = "松江市営バス・一畑バス"
page = "https://matsue-bus.jp/opendata"

