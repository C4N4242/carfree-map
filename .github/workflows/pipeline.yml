name: data pipeline

# 時刻表データの取得と計算を GitHub 上で実行し、結果を results/<地域id>/ にコミットする。
# Actions タブ → "data pipeline" → "Run workflow" で、実行するブランチ・地域・運行日を指定する。
on:
  workflow_dispatch:
    inputs:
      region:
        description: "地域id（regions/<id>.toml）"
        required: true
      date:
        description: "集計する運行日 (YYYY-MM-DD)"
        required: true

permissions:
  contents: write

jobs:
  hubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: GTFS をダウンロード
        run: python pipeline/fetch_data.py --region "${{ inputs.region }}"
      - name: 発車本数で起点候補を順位付け
        run: python pipeline/gtfs_hubs.py --region "${{ inputs.region }}" --date "${{ inputs.date }}" --top 30 | tee hub_ranking.txt
      - name: 結果をジョブの概要に表示
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat hub_ranking.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # 計算結果のみを保存する（元の時刻表データは再配布しない）
      - name: 結果をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "results/${{ inputs.region }}"
          git diff --cached --quiet || git commit -m "結果: ${{ inputs.region }} 起点候補ランキング (${{ inputs.date }})"
          git push
